{% extends 'base.html' %}

{% block title %}Login — DocIntel Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-info display-4 mb-2 d-block"></i>
                    <h3 class="fw-bold gradient-text">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your enterprise documents & RAG assistant</p>
                </div>

                <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label small">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label small">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-info w-100 py-2 rounded-pill fw-bold text-dark mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                    </button>
                </form>

                <div class="text-center text-muted small mt-3">
                    Don't have an account? <a href="{% url 'register' %}" class="text-info text-decoration-none fw-semibold">Create an Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
