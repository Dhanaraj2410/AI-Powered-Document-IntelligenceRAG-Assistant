{% extends 'base.html' %}

{% block title %}Register — DocIntel Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill text-info display-4 mb-2 d-block"></i>
                    <h3 class="fw-bold gradient-text">Create Account</h3>
                    <p class="text-muted small">Register to start building document collections & RAG pipelines</p>
                </div>

                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label small">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Choose a username" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="id_password1" class="form-label small">Password</label>
                        <input type="password" name="password1" id="id_password1" class="form-control" placeholder="Create a password" required autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label for="id_password2" class="form-label small">Confirm Password</label>
                        <input type="password" name="password2" id="id_password2" class="form-control" placeholder="Confirm your password" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-info w-100 py-2 rounded-pill fw-bold text-dark mb-3">
                        <i class="bi bi-person-check-fill me-1"></i> Register & Open Dashboard
                    </button>
                </form>

                <div class="text-center text-muted small mt-3">
                    Already have an account? <a href="{% url 'login' %}" class="text-info text-decoration-none fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
